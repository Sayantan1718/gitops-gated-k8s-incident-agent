[project]
name = "gitops-incident-agent"
version = "0.1.0"
description = "GitOps-gated Kubernetes incident remediation agent (suggest-only, human-merged)"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "langgraph>=1.2,<2.0",         # confirmed working at 1.2.11 — pin exact via pip freeze
    "kubernetes>=31.0,<35.0",      # pin exact resolved version after install (pip freeze)
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "google-genai>=1.20,<2.0",
    "PyGithub>=2.4,<3.0",
    "PyYAML>=6.0,<7.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.4,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-mock>=3.14,<4.0",
    "pytest-asyncio>=0.24,<1.0",
    "msgpack>=1.1,<2.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: requires a live kind cluster (run infra setup first)",
]

[tool.setuptools.packages.find]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"