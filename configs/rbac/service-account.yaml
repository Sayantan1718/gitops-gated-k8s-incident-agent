apiVersion: v1
kind: ServiceAccount
metadata:
  name: incident-agent
  namespace: default
---
# Kubernetes 1.24+ stopped auto-creating SA token Secrets.
# We create one explicitly so we can extract a long-lived token for a
# standalone kubeconfig (local dev only — see README limitations).
apiVersion: v1
kind: Secret
metadata:
  name: incident-agent-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: incident-agent
type: kubernetes.io/service-account-token