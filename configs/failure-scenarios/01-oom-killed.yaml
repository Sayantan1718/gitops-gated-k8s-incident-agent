# Deliberately undersized memory limit — the stress process allocates 150Mi
# against a 50Mi limit, guaranteeing an OOMKilled within seconds of start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
  namespace: failure-lab
  labels:
    failure-class: oom-killed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-demo
  template:
    metadata:
      labels:
        app: oom-demo
    spec:
      containers:
        - name: stress
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
          resources:
            requests:
              memory: "20Mi"
            limits:
              memory: "50Mi"
